        .container {
            max-width: 600px;

            background: #ffffff;

            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #333;
            margin-top: 0;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"] {
            width: calc(100% - 110px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            display: inline-block;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-left: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #resultContainer {
            margin-top: 20px;
        }
        .hospital-card {
            background: #f9f9f9;
            border-left: 4px solid #007bff;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .hospital-card h4 {
            margin: 0 0 8px 0;
            color: #333;
        }
        .hospital-card p {
            margin: 4px 0;
            color: #666;
            font-size: 14px;
        }
        .hospital-card a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        .hospital-card a:hover {
            text-decoration: underline;
        }
        .error {
            color: #d9534f;
            font-weight: bold;
        }
    </style>
</head>

      }

    function findHospitalByText() {
      const query = document.getElementById('locationInput').value.toLowerCase().trim();
      const container = document.getElementById('resultContainer');
      container.innerHTML = '';

      if (!query) {
        container.innerHTML = "<p class='error'>Please enter a location or hospital name to search.</p>";
        return;
      }

      // Filter array elements matching user text query
      const matchedHospitals = hospitals.filter(h => h.name.toLowerCase().includes(query));

      if (matchedHospitals.length > 0) {
        let html = "<h3>Matching Results:</h3>";
        matchedHospitals.forEach(h => {
          const mapLink = h.googleMaps || h.gmap;
          html += `
            <div class="hospital-card">
              <h4>${h.name}</h4>
              <p><b>Coordinates:</b> Lat: ${h.lat}, Lon: ${h.lon}</p>
              <p><a href="${mapLink}" target="_blank">View on Google Maps</a></p>
            </div>
          `;
        });
        container.innerHTML = html;
      } else {
        container.innerHTML = "<p class='error'>No hospitals found matching that location or name in your JSON data.</p>";
      }
    }
</script>
