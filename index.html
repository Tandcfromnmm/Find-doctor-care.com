<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Doctor - AI Symptom Triage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1c2541;
            padding: 20px;
            border-radius: 12px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: none;
        }
        button {
            background-color: #06d6a0;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Find Doctor</h2>
    <div style="background: #3a506b; padding: 15px; border-radius: 8px;">
        <label><strong>AI Symptom Triage</strong></label>
        <input type="text" id="symptomInput" placeholder="Type your symptom (e.g., chest pain, diabetes, cough)...">
        <button onclick="runTriage()">Analyze</button>
        <p id="triageResult" style="font-size: 14px; color: #06d6a0;"></p>
    </div>

    <label for="departmentSelect">Department</label>
    <select id="departmentSelect">
        <option value="">Select Department</option>
        <option value="Cardiology">Cardiology</option>
        <option value="Cardio-Thoracic Surgery">Cardio-Thoracic Surgery</option>
        <option value="Neurology">Neurology</option>
        <option value="Neurosurgery">Neurosurgery</option>
        <option value="Spine Surgery">Spine Surgery</option>
        <option value="Gastroenterology">Gastroenterology</option>
        <option value="Surgical Gastroenterology">Surgical Gastroenterology</option>
        <option value="Pulmonology">Pulmonology</option>
        <option value="Oncology">Oncology</option>
        <option value="Hematology">Hematology</option>
        <option value="Endocrinology">Endocrinology</option>
        <option value="General Surgery">General Surgery</option>
        <option value="Vascular Surgery">Vascular Surgery</option>
        <option value="Pediatrics">Pediatrics</option>
        <option value="General Medicine">General Medicine</option>
    </select>
</div>

<script>
// Expanded Symptom Keyword Mapping
const symptomMap = {
    "Cardiology": ["chest pain", "heart", "palpitation", "bp", "blood pressure", "chest tightness", "angina"],
    "Cardio-Thoracic Surgery": ["bypass", "valve replacement", "open-heart", "congenital heart", "thoracic surgery"],
    "Neurology": ["brain", "headache", "nerve", "dizzy", "seizure", "migraine", "stroke", "numbness", "tingling"],
    "Neurosurgery": ["brain tumor", "severe head injury", "aneurysm", "hydrocephalus"],
    "Spine Surgery": ["back pain", "slipped disc", "sciatica", "spinal injury", "neck pain", "disc herniation"],
    "Gastroenterology": ["stomach", "abdomen", "digestion", "liver", "jaundice", "ibs", "ulcer", "acidity", "diarrhea", "constipation", "aids"],
    "Surgical Gastroenterology": ["severe gallstones", "complex liver resection", "pancreatic surgery", "intestinal obstruction"],
    "Pulmonology": ["cough", "asthma", "breathing difficulty", "shortness of breath", "lung", "chest infection", "wheezing", "tuberculosis"],
    "Oncology": ["cancer", "tumor", "chemotherapy", "malignancy", "growth", "lump"],
    "Hematology": ["blood disorder", "anemia", "leukemia", "bleeding disorder", "low platelets", "hemophilia"],
    "Endocrinology": ["diabetes", "thyroid", "hormonal imbalance", "metabolic", "insulin", "weight gain", "weight loss", "pcos"],
    "General Surgery": ["hernia", "appendix", "gallstones", "minor cuts", "abscess", "tissue lumps", "piles", "fistula"],
    "Vascular Surgery": ["varicose veins", "blocked blood vessels", "dvt", "deep vein thrombosis", "peripheral artery", "circulation"],
    "Pediatrics": ["child", "baby", "infant", "pediatric", "newborn", "kid"]
};

function runTriage() {
    const inputSymptom = document.getElementById("symptomInput").value;
    const text = inputSymptom.toLowerCase().trim();
    
    let matchedDepartment = "General Medicine"; // Default fallback
    
    for (const [department, keywords] of Object.entries(symptomMap)) {
        if (keywords.some(keyword => text.includes(keyword))) {
            matchedDepartment = department;
            break;
        }
    }
    
    // Auto-select the department in the dropdown
    const departmentDropdown = document.getElementById("departmentSelect");
    departmentDropdown.value = matchedDepartment;
    
    // Display result confirmation text
    document.getElementById("triageResult").innerText = `Recommended Department: ${matchedDepartment}. Click to auto-filter department.`;
}
</script>

</body>
</html>
