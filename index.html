<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Portal</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #16223f;
            --text-main: #ffffff;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.2);
            --border-color: #1e293b;
            --radius: 16px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px 16px 0 16px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            flex: 1;
        }
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .brand-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-image {
            width: 48px;
            height: 48px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .brand-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }
        .pinned-notes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }
        .sticky-note {
            background: #fef3a3;
            color: #4a3f0a;
            border-radius: 4px 14px 14px 14px;
            padding: 12px 12px 10px 12px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.35);
            position: relative;
            font-size: 12.5px;
            line-height: 1.4;
            cursor: pointer;
        }
        .sticky-note:nth-child(odd) {
            transform: rotate(-2deg);
        }
        .sticky-note:nth-child(even) {
            transform: rotate(2deg);
        }
        .sticky-note-pin {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
        }
        .sticky-note-title {
            font-weight: 700;
            margin-bottom: 4px;
            padding-right: 14px;
        }
        .sticky-note-date {
            font-size: 10.5px;
            color: #7a6a1a;
            margin-top: 6px;
        }
        .sticky-note-unpin {
            position: absolute;
            top: 4px;
            right: 6px;
            background: none;
            border: none;
            font-size: 12px;
            cursor: pointer;
            color: #7a6a1a;
        }
        .home-app-grid-wrapper {
            margin-bottom: 20px;
        }
        .home-app-grid {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 14px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .home-app-tile {
            background: #0b132b;
            border-radius: 12px;
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .home-app-tile:hover {
            background: #101b36;
        }
        .home-app-tile:active {
            transform: scale(0.97);
        }
        .home-app-tile-icon {
            font-size: 22px;
        }
        .home-app-tile-label {
            color: #ffffff;
            font-size: 12.5px;
            font-weight: 500;
            margin-top: 8px;
        }
        input[type="text"], input[type="date"], select, input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            background: #0b132b;
            border: 1px solid #2d3748;
            border-radius: 12px;
            color: var(--text-main);
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        input[type="text"]:focus, input[type="date"]:focus, select:focus, input[type="password"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .section-heading {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }
        .site-footer {
            width: 100%;
            max-width: 600px;
            margin: 40px auto 24px auto;
            background: rgba(22, 34, 63, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);
            padding: 16px 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .footer-top-row {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
        }
        .footer-divider-horizontal {
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
            margin: 2px 0;
        }
        .footer-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .footer-divider {
            color: #334155;
            font-weight: 300;
        }
        .live-dot {
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            animation: livePulse 2s infinite;
        }
        .refresh-countdown {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            font-variant-numeric: tabular-nums;
        }
        .content-managed-text {
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        .developer-credit {
            display: inline-block;
            font-weight: 600;
            background: linear-gradient(90deg, #38bdf8 0%, #818cf8 35%, #c084fc 70%, #38bdf8 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: colorShine 4s linear infinite;
        }
        #map {
            width: 100%;
            height: 220px;
            border-radius: 12px;
            border: 1px solid #2d3748;
            margin-bottom: 16px;
            z-index: 1;
        }
        @keyframes livePulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 5px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        @keyframes colorShine {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        /* Portal navigation links */
        a.home-app-tile, a.finder-back-row { text-decoration: none; }

        /* Standalone page mode: the card is the page itself, not a popup */
        .modal-overlay.page-mode {
            position: static;
            background: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            padding: 0;
            z-index: auto;
            opacity: 1;
            pointer-events: auto;
            align-items: flex-start;
        }
        .modal-overlay.page-mode:not(.active) { display: none; }
        .modal-overlay.page-mode .modal-card {
            transform: none;
            max-height: none;
            overflow: visible;
        }
        .modal-overlay.page-mode .chat-modal-card {
            transform: none;
            max-width: 100%;
            max-height: none;
            height: calc(100vh - 190px);
            height: calc(100dvh - 190px);
            min-height: 460px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand-header">
            <div class="brand-left">
                <img src="" alt="Logo" class="logo-image" id="brandLogo" onerror="this.style.display='none'">
                <div class="brand-title"></div>
            </div>
        </div>

        <div id="homeAppGrid" class="home-app-grid-wrapper">
            <div class="section-heading">Action Selector</div>
            <div class="home-app-grid">
                <a class="home-app-tile" href="find-doctor.html">
                    <div class="home-app-tile-icon" style="color:#38bdf8;">🩺</div>
                    <div class="home-app-tile-label">Find doctor</div>
                </a>
                <a class="home-app-tile" href="reschedule.html">
                    <div class="home-app-tile-icon" style="color:#60a5fa;">📅</div>
                    <div class="home-app-tile-label">Reschedule</div>
                </a>
                <a class="home-app-tile" href="symptom-check.html">

                </a>
                <a class="home-app-tile" href="near-care.html">

                <a class="home-app-tile" href="chat.html">

                <a class="home-app-tile" href="briefing-updates.html">

                <a class="home-app-tile" href="emergency-contacts.html">

            <!-- Pinned Briefing Updates: shown as sticky notes, only when at least one update is pinned -->
            <div id="pinnedNotesSection" style="display:none;">

    <footer class="site-footer">
        <div class="footer-top-row">
            <div class="footer-item">
                <span class="live-dot"></span>
                <span id="backendTimestamp">Backend Sync: Loading...</span>
            </div>
            <span class="footer-divider">|</span>
            <div class="footer-item">
                <span>Auto-refresh in <span id="countdownTimer" class="refresh-countdown">05:00</span></span>
            </div>
        </div>
        <div class="footer-divider-horizontal"></div>
        <div class="content-managed-text">Content Managed by your office</div>
        <div class="footer-divider-horizontal"></div>
        <div class="footer-item">
            <span class="developer-credit">Website Build & Developed by Murali Manohar</span>
        </div>

    <script>
        let briefingUpdates = [
            {
                id: "upd1",
                dateFrom: "2026-09-06",
                dateTo: "2026-09-06",
                branch: "All Branches",
                title: "New Cardiology consultant joining",
                body: "Dr. availability and OPD timings for the Cardiology department will be updated shortly. Please check the Find Doctor list for the latest schedule."
            },
            {
                id: "upd2",
                dateFrom: "2026-09-03",
                dateTo: "2026-09-03",
                branch: "HITEC City",
                title: "Weekend OPD hours extended",
                body: "This branch now offers extended OPD hours on Saturdays and Sundays. Use Find Near Care to check timings for your nearest branch."
            },
            {
                id: "upd3",
                dateFrom: "2026-09-01",
                dateTo: "2026-09-01",
                branch: "All Branches",
                title: "Reschedule requests turnaround",
                body: "Reschedule requests submitted through the office panel are now reflected on the doctor list within the same day."
            },
            {
                id: "upd4",
                dateFrom: "2026-09-08",
                dateTo: "2026-09-15",
                branch: "HITEC City",
                title: "Dr. A on leave",
                body: "Dr. A is on leave from 8 Sep to 15 Sep. Please choose an alternate doctor or reschedule for this period."
            }
        ];

        // These 4 stay as the built-in fallback shown only if briefing_updates.json is missing,
        // unreachable, or invalid — same safety-net pattern as care_locations.json.
        const defaultBriefingUpdates = briefingUpdates;

        function slugifyForId(text) {
            return String(text || '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/(^-+|-+$)/g, '')
                .slice(0, 40);
        }

        async function loadBriefingUpdates() {
            const fetchWithTimeout = Promise.race([
                fetch('./briefing_updates.json', { cache: 'no-cache' }),
                new Promise((_, reject) => setTimeout(() => reject(new Error('briefing_updates.json request timed out')), 6000))
            ]);

            try {
                const response = await fetchWithTimeout;
                if (!response.ok) throw new Error(`briefing_updates.json not found (${response.status})`);
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error('briefing_updates.json must contain a JSON array');

                // IDs are only used internally (for pinning), so they must be unique — never trust
                // the JSON's "id" field alone: if it's missing, blank, or accidentally repeated
                // across entries (e.g. copy-pasted rows), every duplicate would get treated as the
                // exact same update, making pin/unpin affect all of them at once. Always fall back
                // to a title+date based id, and de-duplicate against anything already used.
                const usedIds = new Set();
                briefingUpdates = data.map((item, index) => {
                    // Accept either a date range (dateFrom / dateTo — e.g. "Dr. A on leave from
                    // 8 Sep to 15 Sep") or a single "date" field for a one-day update. If only
                    // one end of the range is given, treat it as a single-day update.
                    const dateFrom = String(item.dateFrom || item.date || '');
                    const dateTo = String(item.dateTo || item.dateFrom || item.date || '');

                    let id = String(item.id || '').trim();
                    if (!id) id = slugifyForId(`${item.title}-${dateFrom}`) || `upd-${index + 1}`;
                    let uniqueId = id;
                    let suffix = 2;
                    while (usedIds.has(uniqueId)) {
                        uniqueId = `${id}-${suffix++}`;
                    }
                    usedIds.add(uniqueId);
                    return {
                        id: uniqueId,
                        dateFrom,
                        dateTo,
                        branch: String(item.branch || 'All Branches'),
                        title: String(item.title || 'Untitled update'),
                        body: String(item.body || '')
                    };
                });
                console.log(`Loaded ${briefingUpdates.length} briefing updates from briefing_updates.json`);
            } catch (error) {
                console.error('briefing_updates.json could not be loaded, showing built-in sample updates instead:', error);
                briefingUpdates = defaultBriefingUpdates;
            }
            return briefingUpdates;
        }

        const PINNED_BRIEFINGS_KEY = 'pinnedBriefingUpdateIds';

        function getPinnedBriefingIds() {
            try {
                return JSON.parse(localStorage.getItem(PINNED_BRIEFINGS_KEY)) || [];
            } catch (e) {
                return [];
            }
        }

        function setPinnedBriefingIds(ids) {
            try {
                localStorage.setItem(PINNED_BRIEFINGS_KEY, JSON.stringify(ids));
            } catch (e) {
                console.warn('Could not save pinned updates:', e);
            }
        }

        function toggleBriefingPin(id) {
            if (!id) return;
            let pinned = getPinnedBriefingIds();
            if (pinned.includes(id)) {
                pinned = pinned.filter(x => x !== id);
            } else {
                pinned.push(id);
            }
            setPinnedBriefingIds(pinned);
            renderPinnedStickyNotes();
        }

        function formatBriefingDate(isoDate) {
            const d = new Date(isoDate + 'T00:00:00');
            if (isNaN(d)) return isoDate;
            return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        // Shows a single date for a one-day update, or a "8 Sep 2026 – 15 Sep 2026" span
        // for anything spanning more than one day (e.g. a doctor's leave period).
        function formatBriefingDateRange(item) {
            if (!item.dateTo || item.dateTo === item.dateFrom) return formatBriefingDate(item.dateFrom);
            return `${formatBriefingDate(item.dateFrom)} – ${formatBriefingDate(item.dateTo)}`;
        }

        // Emergency contacts are an escalation ladder (Level 1 = first responder, Level 2 =
        // next escalation, etc.) rather than department-based — only Branch is filterable here.
        let emergencyContacts = [
            { id: "ec1", level: 1, role: "MOD (Medical Officer on Duty)", branch: "HITEC City", phone: "+911234500000", timings: "24/7" },
            { id: "ec2", level: 2, role: "Medical Supervisor", branch: "HITEC City", phone: "+911234500001", timings: "24/7" },
            { id: "ec3", level: 3, role: "Duty Manager", branch: "HITEC City", phone: "+911234500002", timings: "24/7" },
            { id: "ec4", level: 1, role: "MOD (Medical Officer on Duty)", branch: "Banjara Hills", phone: "+911234500003", timings: "24/7" },
            { id: "ec5", level: 2, role: "Medical Supervisor", branch: "Banjara Hills", phone: "+911234500004", timings: "24/7" },
            { id: "ec6", level: 1, role: "MOD (Medical Officer on Duty)", branch: "Nampally", phone: "+911234500005", timings: "24/7" }
        ];

        const defaultEmergencyContacts = emergencyContacts;

        let departmentContacts = [
            { id: "dc1", department: "Cardiology", branch: "Banjara Hills", phone: "+911234600000", timings: "9:00 AM – 5:00 PM (Mon–Sat)" },
            { id: "dc2", department: "Orthopedics", branch: "HITEC City", phone: "+911234600001", timings: "10:00 AM – 6:00 PM (Mon–Sat)" },
            { id: "dc3", department: "Pediatrics", branch: "Nampally", phone: "+911234600002", timings: "9:00 AM – 4:00 PM (Mon–Fri)" }
        ];

        const defaultDepartmentContacts = departmentContacts;

        async function loadContactsFile(url, fallback, normalizeItem) {
            const fetchWithTimeout = Promise.race([
                fetch(url, { cache: 'no-cache' }),
                new Promise((_, reject) => setTimeout(() => reject(new Error(`${url} request timed out`)), 6000))
            ]);
            try {
                const response = await fetchWithTimeout;
                if (!response.ok) throw new Error(`${url} not found (${response.status})`);
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error(`${url} must contain a JSON array`);

                // Pinning tracks contacts by id, so ids must be unique — never trust the JSON's
                // "id" field alone (missing or accidentally repeated across rows would make
                // pin/unpin affect every row sharing that id at once, same as we saw with
                // Briefing Updates). De-duplicate against anything already used.
                const usedIds = new Set();
                return data.map((item, index) => {
                    const normalized = normalizeItem(item, index);
                    let id = String(normalized.id || `item-${index + 1}`).trim() || `item-${index + 1}`;
                    let uniqueId = id;
                    let suffix = 2;
                    while (usedIds.has(uniqueId)) {
                        uniqueId = `${id}-${suffix++}`;
                    }
                    usedIds.add(uniqueId);
                    return { ...normalized, id: uniqueId };
                });
            } catch (error) {
                console.error(`${url} could not be loaded, showing built-in sample contacts instead:`, error);
                return fallback;
            }
        }

        async function loadEmergencyContacts() {
            emergencyContacts = await loadContactsFile('./emergency_contacts.json', defaultEmergencyContacts, (item, index) => ({
                id: String(item.id || `ec_${index + 1}`),
                level: Number(item.level) || (index + 1),
                role: String(item.role || item.department || 'Emergency Contact'),
                branch: String(item.branch || ''),
                phone: String(item.phone || ''),
                timings: String(item.timings || '24/7')
            }));
            return emergencyContacts;
        }

        async function loadDepartmentContacts() {
            departmentContacts = await loadContactsFile('./department_contacts.json', defaultDepartmentContacts, (item, index) => ({
                id: String(item.id || `dc_${index + 1}`),
                department: String(item.department || 'General'),
                branch: String(item.branch || ''),
                phone: String(item.phone || ''),
                timings: String(item.timings || 'Timings not specified')
            }));
            return departmentContacts;
        }

        const PINNED_CONTACTS_KEY = 'pinnedContactIds';

        function getPinnedContactIds() {
            try {
                return JSON.parse(localStorage.getItem(PINNED_CONTACTS_KEY)) || [];
            } catch (e) {
                return [];
            }
        }

        function setPinnedContactIds(ids) {
            try {
                localStorage.setItem(PINNED_CONTACTS_KEY, JSON.stringify(ids));
            } catch (e) {
                console.warn('Could not save pinned contacts:', e);
            }
        }

        function toggleContactPin(id) {
            if (!id) return;
            let pinned = getPinnedContactIds();
            if (pinned.includes(id)) {
                pinned = pinned.filter(x => x !== id);
            } else {
                pinned.push(id);
            }
            setPinnedContactIds(pinned);
            renderPinnedStickyNotes();
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>'"]/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[ch]));
        }

        function renderPinnedStickyNotes() {
            const section = document.getElementById('pinnedNotesSection');
            const grid = document.getElementById('pinnedNotesGrid');
            if (!section || !grid) return;

            const pinnedBriefingIds = getPinnedBriefingIds();
            const pinnedBriefingItems = briefingUpdates.filter(u => pinnedBriefingIds.includes(u.id));

            const pinnedContactIds = getPinnedContactIds();
            const pinnedEmergency = emergencyContacts
                .filter(c => pinnedContactIds.includes(c.id))
                .map(c => ({ ...c, contactType: 'emergency' }));
            const pinnedDepartment = departmentContacts
                .filter(c => pinnedContactIds.includes(c.id))
                .map(c => ({ ...c, contactType: 'department' }));
            const pinnedContacts = [...pinnedEmergency, ...pinnedDepartment];

            if (!pinnedBriefingItems.length && !pinnedContacts.length) {
                section.style.display = 'none';
                grid.innerHTML = '';
                return;
            }

            const briefingNotesHtml = pinnedBriefingItems.map(item => `
                <div class="sticky-note" onclick="location.href='briefing-updates.html'">
                    <span class="sticky-note-pin">📌</span>
                    <button type="button" class="sticky-note-unpin" onclick="event.stopPropagation(); toggleBriefingPin('${item.id}')" title="Unpin">✕</button>
                    <div class="sticky-note-title">${escapeHtml(item.title)}</div>
                    <div>${escapeHtml(item.body.slice(0, 70))}${item.body.length > 70 ? '…' : ''}</div>
                    <div class="sticky-note-date">${formatBriefingDateRange(item)} • ${escapeHtml(item.branch)}</div>
                </div>
            `).join('');

            const contactNotesHtml = pinnedContacts.map(c => {
                const isEmergency = c.contactType === 'emergency';
                const openFn = isEmergency ? "location.href='emergency-contacts.html'" : "location.href='department-contacts.html'";
                const title = isEmergency ? `Level ${escapeHtml(String(c.level))}: ${escapeHtml(c.role)}` : escapeHtml(c.department);
                return `
                <div class="sticky-note" onclick="${openFn}">
                    <span class="sticky-note-pin">📌</span>
                    <button type="button" class="sticky-note-unpin" onclick="event.stopPropagation(); toggleContactPin('${c.id}')" title="Unpin">✕</button>
                    <div class="sticky-note-title">${title}</div>
                    <div>${escapeHtml(c.phone)}</div>
                    <div class="sticky-note-date">${escapeHtml(c.branch)} • ${escapeHtml(c.timings)}</div>
                </div>
            `;
            }).join('');

            section.style.display = 'block';
            grid.innerHTML = briefingNotesHtml + contactNotesHtml;
        }

        function formatBackendDate(dateObj) {
            let hours = dateObj.getHours();
            let minutes = dateObj.getMinutes();
            const ampm = hours >= 12 ? 'pm' : 'am';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            const day = dateObj.getDate();
            const getOrdinal = (n) => {
                const s = ["th", "st", "nd", "rd"];
                const v = n % 100;
                return n + (s[(v - 20) % 10] || s[v] || s[0]);
            };
            const formattedDay = getOrdinal(day);
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const month = months[dateObj.getMonth()];
            const year = dateObj.getFullYear();
            return `${hours}:${minutes}${ampm} on ${formattedDay} ${month} ${year}`;
        }

        function checkBackendSync() {
            const timestampEl = document.getElementById('backendTimestamp');
            if (timestampEl) {
                timestampEl.textContent = `Backend Sync: ${formatBackendDate(new Date())}`;
            }
        }

        // Pinned notes come from the same JSON files the Briefing and Contact pages use.
        function loadHomeData() {
            renderPinnedStickyNotes();
            Promise.all([loadBriefingUpdates(), loadEmergencyContacts(), loadDepartmentContacts()])
                .then(() => { renderPinnedStickyNotes(); checkBackendSync(); });
        }

        loadHomeData();

        const REFRESH_INTERVAL_SECONDS = 300;
        let timeLeft = REFRESH_INTERVAL_SECONDS;

        function updateCountdownDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const formattedTime = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            const timerEl = document.getElementById('countdownTimer');
            if (timerEl) {
                timerEl.textContent = formattedTime;
            }
        }

        setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                loadHomeData();
                timeLeft = REFRESH_INTERVAL_SECONDS;
            }
            updateCountdownDisplay();
        }, 1000);

        updateCountdownDisplay();
    </script>
</body>
</html>
