<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Near Care - CARE Hospitals</title>
    <style>
        /* Base Reset & Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Trigger Button to Open Modal */
        .open-modal-btn {
            background: #0a84ff;
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .open-modal-btn:hover {
            background: #0071e3;
        }

        /* Apple-Style Modal CSS */
        .apple-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .apple-modal-card {
            background: rgba(28, 28, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            width: 90%;
            max-width: 440px;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            color: #f5f5f7;
            position: relative;
            text-align: left;
            box-sizing: border-box;
        }

        .apple-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aeaeb2;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .apple-close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .apple-modal-header {
            margin-bottom: 20px;
        }

        .apple-icon-badge {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .apple-modal-header h2 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin: 0 0 6px 0;
            color: #fff;
        }

        .apple-modal-header p {
            font-size: 14px;
            color: #86868b;
            margin: 0;
            line-height: 1.4;
        }

        .apple-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .apple-input-group input {
            flex: 1;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 16px;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        .apple-input-group input:focus {
            border-color: #0a84ff;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.2);
        }

        .apple-primary-btn {
            background: #0a84ff;
            color: #fff;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .apple-primary-btn:hover {
            background: #0071e3;
        }

        .apple-results-container {
            max-height: 240px;
            overflow-y: auto;
            display: none; /* Hidden by default until searched */
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
        }

        .apple-result-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s ease;
        }

        .apple-result-item:hover {
            background: rgba(255, 255, 255, 0.09);
        }

        .hospital-info h4 {
            margin: 0 0 4px 0;
            font-size: 15px;
            font-weight: 500;
            color: #fff;
        }

        .hospital-info p {
            margin: 0;
            font-size: 13px;
            color: #86868b;
        }

        .hospital-metrics {
            text-align: right;
        }

        .metric-distance {
            font-size: 14px;
            font-weight: 600;
            color: #32d74b;
        }

        .metric-time {
            font-size: 12px;
            color: #86868b;
        }
    </style>
</head>
<body>

    <!-- Trigger Button -->
    <button class="open-modal-btn" onclick="openModal()">Find Near Care</button>

    <!-- Apple-Style Location Modal -->
    <div id="nearCareModal" class="apple-modal-overlay" style="display: none;">
        <div class="apple-modal-card">
            <!-- Close Button -->
            <button class="apple-close-btn" onclick="closeModal()">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <path d="M1 1L13 13M1 13L13 1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>

            <!-- Header -->
            <div class="apple-modal-header">
                <div class="apple-icon-badge">📍</div>
                <h2>Find Near Care</h2>
                <p>Enter your location manually to discover the nearest CARE Hospitals branches.</p>
            </div>

            <!-- Input Section -->
            <div class="apple-input-group">
                <input type="text" id="locationInput" placeholder="e.g., Banjara Hills, Hyderabad" autocomplete="off">
                <button onclick="searchHospitals()" class="apple-primary-btn">Search</button>
            </div>

            <!-- Results Section -->
            <div id="hospitalResults" class="apple-results-container">
                <!-- Dynamic results will be injected here -->
            </div>
        </div>
    </div>

    <script>
        // Sample CARE Hospitals branches data
        const careBranches = [
            { name: "CARE Hospitals - Banjara Hills", address: "Road No. 1, Hyderabad", baseKm: 3.2 },
            { name: "CARE Hospitals - Hitec City", address: "Gachibowli, Hyderabad", baseKm: 6.8 },
            { name: "CARE Hospitals - Malakpet", address: "Main Road, Hyderabad", baseKm: 9.1 },
            { name: "CARE Hospitals - Secunderabad", address: "Musheerabad, Hyderabad", baseKm: 5.4 }
        ];

        function openModal() {
            document.getElementById('nearCareModal').style.display = 'flex';
            document.getElementById('locationInput').focus();
        }

        function closeModal() {
            document.getElementById('nearCareModal').style.display = 'none';
        }

        function searchHospitals() {
            const inputVal = document.getElementById('locationInput').value.trim();
            const resultsContainer = document.getElementById('hospitalResults');

            if (!inputVal) {
                alert("Please enter a valid location.");
                return;
            }

            // Show results container smoothly
            resultsContainer.style.display = 'flex';
            resultsContainer.innerHTML = '';

            // Generate customized feedback layout based on input length or data simulation
            careBranches.forEach((branch, index) => {
                const randomOffset = (inputVal.length + index) % 4;
                const distance = (branch.baseKm + randomOffset * 0.7).toFixed(1);
                const travelTime = Math.round(distance * 3.5); // Estimated minutes drive

                const itemHTML = `
                    <div class="apple-result-item">
                        <div class="hospital-info">
                            <h4>${branch.name}</h4>
                            <p>${branch.address}</p>
                        </div>
                        <div class="hospital-metrics">
                            <div class="metric-distance">${distance} km</div>
                            <div class="metric-time">~${travelTime} mins drive</div>
                        </div>
                    </div>
                `;
                resultsContainer.innerHTML += itemHTML;
            });
        }
    </script>
</body>
</html>
